<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BypassAdsJellybut</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 15px; }
    
    .sub-header { font-size: 11px; color: #3fb950; letter-spacing: 1px; font-weight: bold; margin-bottom: 2px; }
    h1 { font-size: 24px; color: #ffffff; font-weight: bold; margin-bottom: 2px; }
    .status-root { font-size: 10px; color: #8b949e; letter-spacing: 0.5px; margin-bottom: 15px; }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .card-title { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px; }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-green { background-color: #2ea043; color: #ffffff; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-start { background-color: #2ea043; color: #ffffff; flex: 1; }
    .btn-stop { background-color: #21262d; color: #8b949e; border: 1px solid #30363d; flex: 1; }

    .url-display {
      font-size: 11px;
      color: #e6edf3;
      word-break: break-all;
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .webview-status { font-size: 12px; color: #3fb950; margin-bottom: 10px; }

    iframe {
      width: 100%;
      height: 50vh;
      border: 1px solid #30363d;
      border-radius: 8px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="sub-header">CONTROL WEB JELLYBUT</div>
  <h1>AdPingerMulti</h1>
  <div class="status-root">ROOT DEVICE • MAGISK ROOT ACCESS OK</div>

  <!-- Section 1: Remote URL Source -->
  <div class="card">
    <div class="card-title">REMOTE URL SOURCE</div>
    <!-- Ubah atau tempel URL raw kamu di kolom input ini -->
    <input type="text" id="urlSource" value="https://koboykoboy131-hub.github.io/AdsJellybut/">
    <button class="btn btn-green" onclick="loadRemoteUrls()">SAVE & REFRESH</button>
  </div>

  <!-- Section 2: Automation Control -->
  <div class="card">
    <div class="card-title">AUTOMATION</div>
    <select id="timerSelect">
      <option value="5">5 detik (tes cepat)</option>
      <option value="60">1 menit</option>
      <option value="300" selected>5 menit (auto pilih)</option>
    </select>
    <div class="btn-group">
      <button class="btn btn-start" id="btnStart" onclick="startRotation()">START</button>
      <button class="btn btn-stop" id="btnStop" onclick="stopRotation()">STOP</button>
    </div>
  </div>

  <!-- Section 3: WebView Display -->
  <div class="card">
    <div class="card-title">WEBVIEW</div>
    <div class="url-display" id="currentUrlText">Memuat URL...</div>
    <div class="webview-status" id="statusText">WebView aktif: Menunggu perintah...</div>
    <iframe id="webFrame" src="about:blank"></iframe>
  </div>

  <script>
    // MASUKKAN DAFTAR URL KAMU DI SINI
    let daftarUrl = [
      "https://keytoto.com/",
      "https://superpetir19.com/",
      "https://lucu123landasan.co/",
      "https://evoscuan04.pages.dev/",
      "https://coloksgp19.com/",
      "https://yakuza66-gaming.pages.dev/"
    ];

    let indexWeb = 0;
    let timerId = null;

    const frame = document.getElementById("webFrame");
    const currentUrlText = document.getElementById("currentUrlText");
    const statusText = document.getElementById("statusText");

    function gantiTampilanWeb() {
      if (daftarUrl.length === 0) return;
      
      const urlBaru = daftarUrl[indexWeb];
      frame.src = urlBaru;
      currentUrlText.innerText = urlBaru;
      statusText.innerText = "WebView aktif: Memuat halaman...";

      frame.onload = () => {
        statusText.innerText = "WebView aktif: HTTP/halaman selesai dimuat";
      };

      indexWeb = (indexWeb + 1) % daftarUrl.length;
    }

    async function loadRemoteUrls() {
      const sourceInput = document.getElementById("urlSource").value.trim();
      
      // Jika input adalah link teks/raw dari github
      if (sourceInput.startsWith("http")) {
        try {
          statusText.innerText = "Membaca daftar URL dari source...";
          const response = await fetch(sourceInput);
          const text = await response.text();
          
          // Pisahkan baris per URL
          const urls = text.split("\n").map(u => u.trim()).filter(u => u.length > 0 && u.startsWith("http"));
          
          if (urls.length > 0) {
            daftarUrl = urls;
            indexWeb = 0;
            alert("Berhasil memuat " + urls.length + " URL dari Remote Source!");
            gantiTampilanWeb();
          } else {
            // Jika bukan file TXT daftar URL, buka langsung URL tersebut
            daftarUrl = [sourceInput];
            indexWeb = 0;
            gantiTampilanWeb();
          }
        } catch (e) {
          // Jika gagal fetch (misal diblokir CORS), buka URL secara langsung
          daftarUrl = [sourceInput];
          indexWeb = 0;
          gantiTampilanWeb();
        }
      }
    }

    function startRotation() {
      stopRotation();
      const detik = parseInt(document.getElementById("timerSelect").value);
      
      document.getElementById("btnStart").style.opacity = "0.6";
      document.getElementById("btnStop").style.borderColor = "#f85149";
      document.getElementById("btnStop").style.color = "#f85149";

      gantiTampilanWeb();
      timerId = setInterval(gantiTampilanWeb, detik * 1000);
    }

    function stopRotation() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      document.getElementById("btnStart").style.opacity = "1";
      document.getElementById("btnStop").style.borderColor = "#30363d";
      document.getElementById("btnStop").style.color = "#8b949e";
      statusText.innerText = "WebView dihentikan (STOP)";
    }

    // Jalankan awal
    gantiTampilanWeb();
  </script>

</body>
</html>
