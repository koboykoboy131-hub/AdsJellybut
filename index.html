<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JellybutAdsControler + GAS Connected</title>

    <!-- [SLOT 1] SCRIPT IKLAN HEADER / DIRECT LINK (JIKA ADA) -->

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .header { margin-bottom: 20px; }
        .sub-header { font-size: 11px; color: #3b82f6; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .title { font-size: 24px; font-weight: 800; margin: 4px 0; }
        .status-badge { font-size: 11px; color: #10b981; font-weight: 600; letter-spacing: 0.5px; }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 12px; letter-spacing: 0.5px; }

        .ad-container {
            width: 100%;
            min-height: 50px;
            background-color: #05070d;
            border: 1px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
            text-align: center;
        }

        .select-box {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
        }

        .select-box:focus { border-color: #2563eb; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; }
        .btn-blue { background-color: #2563eb; color: white; }
        .btn-green { background-color: #16a34a; color: white; margin-top: 6px; }
        .btn-red { background-color: #dc2626; color: white; }

        .button-group { display: flex; gap: 10px; }
        .button-group .btn { flex: 1; }

        .log-console {
            background-color: #05070d;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #10b981;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry { line-height: 1.4; word-break: break-all; }
        .log-entry .time { color: #6b7280; }
        .log-entry.system { color: #3b82f6; }
        .log-entry.alert { color: #ef4444; }
        .log-entry.gas { color: #f59e0b; }

        .url-display { font-size: 13px; color: #60a5fa; word-break: break-all; margin-bottom: 4px; }
        .status-text { font-size: 12px; color: #9ca3af; margin-bottom: 12px; }

        .webview-box {
            width: 100%;
            height: 400px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f2937;
        }

        .webview-box iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Slot Iklan Banner Atas -->
    <div class="ad-container" id="ad-slot-top">
        <span style="font-size: 11px; color: #6b7280;">[ Slot Iklan Banner Atas ]</span>
    </div>

    <!-- Header Section -->
    <div class="header">
        <div class="sub-header">CONTROL WEB JELLYBUT</div>
        <div class="title">JellybutAdsControler</div>
        <div class="status-badge">● GOOGLE APPS SCRIPT CONNECTED</div>
    </div>

    <!-- Google Apps Script Control Card -->
    <div class="card">
        <div class="card-label">GOOGLE APPS SCRIPT BACKEND</div>
        <p style="font-size: 11px; color: #9ca3af; margin-bottom: 10px;">URL GAS aktif & terintegrasi secara otomatis di server.</p>
        <button class="btn btn-green" onclick="triggerGAS()">TRIGGER URLFETCHAPP (GAS)</button>
    </div>

    <!-- Automation Card -->
    <div class="card">
        <div class="card-label">AUTOMATION</div>
        <select id="timer-select" class="select-box">
            <option value="60000" selected>1 Menit</option>
            <option value="120000">2 Menit</option>
            <option value="300000">5 Menit</option>
            <option value="30000">30 Detik</option>
        </select>
        <div class="button-group">
            <button class="btn btn-blue" onclick="startAutomation()">START</button>
            <button class="btn btn-red" onclick="stopAutomation()">STOP</button>
        </div>
    </div>

    <!-- Slot Iklan Banner Tengah -->
    <div class="ad-container" id="ad-slot-middle">
        <span style="font-size: 11px; color: #6b7280;">[ Slot Iklan Banner Tengah ]</span>
    </div>

    <!-- Activity Log Console -->
    <div class="card">
        <div class="card-label">SYSTEM & ROTATION LOG</div>
        <div id="log-console" class="log-console"></div>
    </div>

    <!-- WebView Section -->
    <div class="card">
        <div class="card-label">WEBVIEW DISPLAY</div>
        <div id="current-url" class="url-display">-</div>
        <div id="wv-status" class="status-text">WebView Berjalan (Otomatis)</div>
        
        <div class="webview-box">
            <!-- Sandbox dihapus agar iframe memuat halaman tanpa blokir skrip internal -->
            <iframe id="ad-frame" src="" title="WebView Display" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // URL Web App Google Apps Script
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxpgunv7ZkN4uky2NCDrqsLMHNGu1BC_4x9uTgy6IXoelKHgqWmgl-9T2ET0jUQAZ4M/exec";

        // Daftar URL Web Rotasi (Bisa diisi 1 URL atau banyak URL)
        const urlList = [
            "https://keytoto.com/",
            "https://superpetir19.com/",
            "https://lucu123landasan.co/",
            "https://evoscuan04.pages.dev/",
            "https://coloksgp19.com/",
            "https://yakuza66-gaming.pages.dev/",
            "https://pusat.coloksgp-bet.cloud/",
            "https://official.pantaslucu123.com/",
            "https://dana.tokoipad.click/",
            "https://pastigampangmenang.pages.dev/",
            "https://mobile.keytoto-indonesia-my.id/",
            "https://permainan.iosbetcastle.art/",
            "https://katak22.net/",
            "https://sanca999.ink/",
            "https://situs.omacuan-resmigacorabiss.com/",
            "https://gate.api66-core.host/",
            "https://eksklusif.wrapfactorykc.online/",
            "https://tuanpetir.com/",
            "https://ms.akses-samurai69.com/",
            "https://galakkale.wopslot-zeus.forum/",
            "https://omacuan.com/",
            "https://urbangreen.store/",
            "https://indo88win.org/"
        ];

        let autoInterval = null;
        let currentActiveUrl = "";

        function addLog(message, type = 'normal') {
            const consoleBox = document.getElementById('log-console');
            const timeString = new Date().toLocaleTimeString('id-ID');
            
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${timeString}]</span> ${message}`;
            
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function changeRandomUrl() {
            const randomIndex = Math.floor(Math.random() * urlList.length);
            currentActiveUrl = urlList[randomIndex];
            
            document.getElementById('ad-frame').src = currentActiveUrl;
            document.getElementById('current-url').innerText = currentActiveUrl;
            
            addLog(`URL Dimuat: ${currentActiveUrl}`);
        }

        // Trigger GAS menggunakan metode Image Ping (Bypass CORS 100%)
        function triggerGAS() {
            addLog("Mengirim sinyal ke Google Apps Script...", "gas");

            const img = new Image();
            const targetFullUrl = `${GAS_WEB_APP_URL}?url=${encodeURIComponent(currentActiveUrl)}&t=${new Date().getTime()}`;

            img.onload = function() {
                addLog("GAS Response: Sinyal berhasil terkirim!", "gas");
            };

            img.onerror = function() {
                addLog("GAS Response: Sinyal terkirim ke Server Google!", "gas");
            };

            img.src = targetFullUrl;
        }

        function startAutomation() {
            if (autoInterval) clearInterval(autoInterval);
            
            const duration = parseInt(document.getElementById('timer-select').value);
            const seconds = duration / 1000;
            
            changeRandomUrl();
            autoInterval = setInterval(changeRandomUrl, duration);
            
            document.getElementById('wv-status').innerText = `WebView Berjalan (Otomatis ${seconds}s)`;
            document.getElementById('wv-status').style.color = "#4ade80";
            
            addLog(`Otomatisasi dijalankan. Interval: ${seconds} detik`, "system");
        }

        function stopAutomation() {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
            }
            document.getElementById('wv-status').innerText = "WebView Dihentikan (Manual)";
            document.getElementById('wv-status').style.color = "#f87171";
            
            addLog("Otomatisasi dihentikan oleh pengguna.", "alert");
        }

        window.onload = function() {
            addLog("Sistem kontrol siap. GAS Connected.", "system");
            startAutomation();
        };
    </script>
</body>
</html>
