<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellybut Offerwall Controller</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header UI */
        .header {
            margin-bottom: 15px;
            text-align: center;
        }

        .sub-header {
            font-size: 11px;
            color: #3b82f6;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .title {
            font-size: 22px;
            font-weight: 800;
            margin: 4px 0;
        }

        .status-badge {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        /* Card Container */
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Reward Task Bar */
        .task-box {
            background-color: #1e293b;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 16px;
        }

        .timer-display {
            font-size: 20px;
            font-weight: 800;
            color: #f59e0b;
            margin: 6px 0;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-claim {
            background-color: #10b981;
            color: white;
            display: none; /* Sembunyi sebelum timer selesai */
        }

        .btn-claim:active {
            opacity: 0.8;
        }

        /* Activity Log Console */
        .log-console {
            background-color: #05070d;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #10b981;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry { line-height: 1.4; word-break: break-all; }
        .log-entry .time { color: #6b7280; }
        .log-entry.system { color: #3b82f6; }
        .log-entry.success { color: #10b981; }

        /* WebView Container */
        .url-display { font-size: 12px; color: #60a5fa; word-break: break-all; margin-bottom: 4px; }
        
        .webview-box {
            width: 100%;
            height: 380px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f2937;
        }

        .webview-box iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <div class="sub-header">OFFERWALL GAME SYSTEM</div>
        <div class="title">Jellybut Task Center</div>
        <div class="status-badge">TUGAS MENONTON & ROTASI IKLAN</div>
    </div>

    <!-- Reward Status Card -->
    <div class="task-box">
        <div class="card-label" style="color: #94a3b8;">SISA WAKTU TUGAS GAMER</div>
        <div id="timer-text" class="timer-display">60 Detik</div>
        <p id="task-desc" style="font-size: 11px; color: #9ca3af;">Tetap berada di halaman ini untuk mengklaim Reward DANA.</p>
        <button id="claim-btn" class="btn btn-claim" onclick="sendRewardToGame()">KLAIM REWARD SALDO DANA</button>
    </div>

    <!-- System & Rotation Log -->
    <div class="card">
        <div class="card-label">TASK & ROTATION LOG</div>
        <div id="log-console" class="log-console"></div>
    </div>

    <!-- WebView Section -->
    <div class="card">
        <div class="card-label">PREVIEW ROTASI WEB</div>
        <div id="current-url" class="url-display">-</div>
        
        <div class="webview-box">
            <!-- Sandbox memblokir auto-redirect paksa keluar dari aplikasi -->
            <iframe id="ad-frame" src="" title="WebView Display" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
    </div>

    <script>
        // Daftar URL Web Rotasi
        const urlList = [
            "https://keytoto.com/",
            "https://superpetir19.com/",
            "https://lucu123landasan.co/",
            "https://evoscuan04.pages.dev/",
            "https://coloksgp19.com/",
            "https://yakuza66-gaming.pages.dev/",
            "https://pusat.coloksgp-bet.cloud/",
            "https://official.pantaslucu123.com/",
            "https://dana.tokoipad.click/",
            "https://pastigampangmenang.pages.dev/",
            "https://mobile.keytoto-indonesia-my.id/",
            "https://permainan.iosbetcastle.art/",
            "https://katak22.net/",
            "https://sanca999.ink/",
            "https://situs.omacuan-resmigacorabiss.com/",
            "https://gate.api66-core.host/",
            "https://eksklusif.wrapfactorykc.online/",
            "https://tuanpetir.com/",
            "https://ms.akses-samurai69.com/",
            "https://galakkale.wopslot-zeus.forum/",
            "https://omacuan.com/",
            "https://urbangreen.store/",
            "https://indo88win.org/"
        ];

        let countdown = 60; // Durasi Tugas (60 Detik)
        let timerInterval = null;

        // Fungsi mencatat pesan log
        function addLog(message, type = 'normal') {
            const consoleBox = document.getElementById('log-console');
            const timeString = new Date().toLocaleTimeString('id-ID');
            
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="time">[${timeString}]</span> ${message}`;
            
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Fungsi mengganti URL secara acak
        function changeRandomUrl() {
            const randomIndex = Math.floor(Math.random() * urlList.length);
            const selectedUrl = urlList[randomIndex];
            
            document.getElementById('ad-frame').src = selectedUrl;
            document.getElementById('current-url').innerText = selectedUrl;
            
            addLog(`Rotasi Web: Dimuat ${selectedUrl}`);
        }

        // Hitung Mundur Tugas
        function startTaskTimer() {
            timerInterval = setInterval(() => {
                countdown--;
                document.getElementById('timer-text').innerText = `${countdown} Detik`;

                if (countdown % 15 === 0 && countdown > 0) {
                    changeRandomUrl(); // Ganti web setiap 15 detik
                }

                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer-text').innerText = "TUGAS SELESAI!";
                    document.getElementById('timer-text').style.color = "#10b981";
                    document.getElementById('task-desc').innerText = "Silakan klik tombol di bawah untuk mengambil reward kamu.";
                    document.getElementById('claim-btn').style.display = "block";
                    
                    addLog("Tugas selesai. Tombol klaim aktif!", "success");
                }
            }, 1000);
        }

        // Mengirimkan Sinyal Ke Game (Android / Unity Interface)
        function sendRewardToGame() {
            addLog("Mengirim sinyal reward ke Game...", "system");

            // 1. Jalur Android Studio Native
            if (window.AndroidInterface && typeof window.AndroidInterface.onTaskCompleted === 'function') {
                window.AndroidInterface.onTaskCompleted();
                addLog("Reward terkirim via Android Interface!", "success");
            } 
            // 2. Jalur Unity (UniWebView Protocol)
            else if (window.UniWebView) {
                window.location.href = "uniwebview://task-complete";
                addLog("Reward terkirim via UniWebView Protocol!", "success");
            } 
            // 3. Fallback browser biasa
            else {
                alert("Tugas Selesai! Saldo DANA berhasil diklaim ke Akun Game.");
            }
        }

        // Inisialisasi awal saat halaman dibuka
        window.onload = function() {
            addLog("Offerwall dimulai...", "system");
            changeRandomUrl();
            startTaskTimer();
        };
    </script>
</body>
</html>
