<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JellybutAdsControler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 15px; }
    
    /* Sub Header & Title dengan Akses Biru */
    .sub-header { font-size: 11px; color: #58a6ff; letter-spacing: 1px; font-weight: bold; margin-bottom: 2px; }
    h1 { font-size: 24px; color: #ffffff; font-weight: bold; margin-bottom: 2px; }
    .status-root { font-size: 10px; color: #8b949e; letter-spacing: 0.5px; margin-bottom: 15px; }

    /* Card Container */
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .card-title { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px; }

    /* Input & Select */
    input[type="text"], select {
      width: 100%;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e6edf3;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: #1f6beb;
    }

    /* Buttons dengan Tema Biru */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-blue { background-color: #1f6beb; color: #ffffff; }
    .btn-blue:active { background-color: #1158c7; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-start { background-color: #1f6beb; color: #ffffff; flex: 1; }
    .btn-stop { background-color: #21262d; color: #8b949e; border: 1px solid #30363d; flex: 1; }

    /* WebView Area */
    .url-display {
      font-size: 11px;
      color: #e6edf3;
      word-break: break-all;
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .webview-status { font-size: 12px; color: #58a6ff; margin-bottom: 10px; }

    iframe {
      width: 100%;
      height: 50vh;
      border: 1px solid #1f6beb;
      border-radius: 8px;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="sub-header">CONTROL WEB JELLYBUT</div>
  <h1>JellybutAdsControler</h1>
  <div class="status-root">ROOT DEVICE • MAGISK ROOT ACCESS OK</div>

  <div class="card">
    <div class="card-title">REMOTE URL SOURCE</div>
    <input type="text" id="urlSource" value="https://koboykoboy131-hub.github.io/AdsJellybut/">
    <button class="btn btn-blue" onclick="loadSource()">SAVE & REFRESH</button>
  </div>

  <div class="card">
    <div class="card-title">AUTOMATION</div>
    <select id="timerSelect">
      <option value="5">5 detik (tes cepat)</option>
      <option value="60">1 menit</option>
      <option value="300" selected>5 menit (auto pilih)</option>
    </select>
    <div class="btn-group">
      <button class="btn btn-start" id="btnStart" onclick="startRotation()">START</button>
      <button class="btn btn-stop" id="btnStop" onclick="stopRotation()">STOP</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">WEBVIEW</div>
    <div class="url-display" id="currentUrlText">Memuat web...</div>
    <div class="webview-status" id="statusText">WebView aktif: Memuat...</div>
    <iframe id="webFrame" src="about:blank"></iframe>
  </div>

  <script>
    let daftarUrl = [
      "https://keytoto.com/",
      "https://superpetir19.com/",
      "https://lucu123landasan.co/",
      "https://evoscuan04.pages.dev/",
      "https://coloksgp19.com/",
      "https://yakuza66-gaming.pages.dev/"
    ];

    let indexWeb = 0;
    let timerId = null;

    const frame = document.getElementById("webFrame");
    const currentUrlText = document.getElementById("currentUrlText");
    const statusText = document.getElementById("statusText");

    function gantiTampilanWeb() {
      if (daftarUrl.length === 0) return;

      const urlBaru = daftarUrl[indexWeb];
      frame.src = urlBaru;
      currentUrlText.innerText = urlBaru;
      statusText.innerText = "WebView aktif: Memuat halaman...";

      frame.onload = () => {
        statusText.innerText = "WebView aktif: HTTP/halaman selesai dimuat";
      };

      indexWeb = (indexWeb + 1) % daftarUrl.length;
    }

    function startRotation() {
      stopRotation();
      const detik = parseInt(document.getElementById("timerSelect").value);
      
      document.getElementById("btnStart").style.opacity = "0.6";
      document.getElementById("btnStop").style.borderColor = "#f85149";
      document.getElementById("btnStop").style.color = "#f85149";

      gantiTampilanWeb();
      timerId = setInterval(gantiTampilanWeb, detik * 1000);
    }

    function stopRotation() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      document.getElementById("btnStart").style.opacity = "1";
      document.getElementById("btnStop").style.borderColor = "#30363d";
      document.getElementById("btnStop").style.color = "#8b949e";
      statusText.innerText = "WebView dihentikan (STOP)";
    }

    function loadSource() {
      const inputUrl = document.getElementById("urlSource").value;
      if (inputUrl) {
        frame.src = inputUrl;
        currentUrlText.innerText = inputUrl;
        statusText.innerText = "WebView dimuat dari Source Input";
      }
    }

    // Jalankan awal
    gantiTampilanWeb();
  </script>

</body>
</html>
