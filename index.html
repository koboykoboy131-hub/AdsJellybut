<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JellybutAdsControler</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 15px; }
        .sub-header { font-size: 11px; color: #58a6ff; letter-spacing: 2px; font-weight: bold; margin-bottom: 2px; }
        h1 { font-size: 24px; color: #ffffff; font-weight: bold; margin-bottom: 2px; }
        .status-root { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 15px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card-title { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; }
        input[type="text"], select { width: 100%; padding: 12px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 14px; margin-bottom: 10px; outline: none; }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }
        .btn-blue { background-color: #1f6feb; color: #ffffff; }
        .btn-blue:active { background-color: #1158c7; }
        .btn-group { display: flex; gap: 10px; }
        .btn-start { background-color: #238636; color: #ffffff; flex: 1; }
        .btn-stop { background-color: #21262d; color: #8b949e; border: 1px solid #30363d; flex: 1; }
        .url-display { font-size: 11px; color: #58a6ff; word-break: break-all; margin-bottom: 5px; }
        .webview-status { font-size: 12px; color: #58a6ff; margin-bottom: 10px; }
        iframe { width: 100%; height: 450px; border: 1px solid #30363d; border-radius: 8px; background-color: #ffffff; }
        .root-warning { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0d1117; padding: 20px; text-align: center; z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .root-warning h2 { font-size: 24px; margin-bottom: 10px; color: #f85149; }
        .root-warning p { font-size: 14px; color: #8b949e; }
    </style>
</head>
<body>

    <!-- Tampilan Peringatan jika HP Root -->
    <div id="root-screen" class="root-warning">
        <h2>Akses Ditolak!</h2>
        <p>Aplikasi ini tidak mendukung perangkat yang di-root (Root/Magisk Detected).</p>
    </div>

    <!-- Tampilan Utama Dashboard -->
    <div id="app-screen">
        <div class="sub-header">CONTROL WEB JELLYBUT</div>
        <h1>JellybutAdsControler</h1>
        <div class="status-root" id="status-root">NON-ROOT DEVICE • SYSTEM SECURE</div>

        <div class="card">
            <div class="card-title">Remote URL Source (Rotasi Otomatis)</div>
            <input type="text" id="remote-url-input" value="">
            <button class="btn btn-blue" onclick="saveAndRefresh()">Save & Refresh</button>
        </div>

        <div class="card">
            <div class="card-title">Automation</div>
            <select id="auto-timer">
                <option value="5000">5 Detik (auto pilih)</option>
                <option value="300000">5 Menit (auto pilih)</option>
                <option value="600000">10 Menit (auto pilih)</option>
            </select>
            <div class="btn-group">
                <button id="btn-start" class="btn btn-start" onclick="startAutomation()">Start</button>
                <button id="btn-stop" class="btn btn-stop" onclick="stopAutomation()">Stop</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Webview</div>
            <div class="url-display" id="url-text">Memuat target...</div>
            <div class="webview-status">WebView Berjalan</div>
            <iframe id="ad-frame" src="" crossorigin="anonymous"></iframe>
        </div>
    </div>

    <!-- Script Iklan Utama (Campaign ID Aktif) -->
    <script async src="lucu123landasan.co/?CampaignID=514560911&adSETID=516604429&CreativeID=519599669&click_id=1Uh-miqKLjttilOUbW9UINHc7pbahDJg8gd3T84VTr7_n6QUcZ4eFJppjM4fyg1eEqsb1XEXtHnxDQItlzTPBDkpSydj4Q7nOTl9o5S84vjxyAXuPZKRgdEuI_hMtaXB&pixel_id=289228937228304" crossorigin="anonymous"></script>
    
    <!-- Wadah Iklan Pendukung (Ad Slots) -->
    <ins class="adsbygoogle" style="display:none;width:970px;height:250px" data-ad-client="ca-pubxxx" data-ad-slot="slot_id"></ins>
    <ins class="adsbygoogle" style="display:none;width:250px;height:250px" data-ad-client="ca-pubxxx" data-ad-slot="slot_id"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

    <!-- Skrip Logika Dashboard & Rotasi Acak -->
    <script>
        // DAFTAR URL TARGET YANG SUDAH DIPERBARUI
        var daftarSitus = [
            "https://keytoto.com/",
            "https://superpetir19.com/",
            "https://lucu123landasan.co/",
            "https://evoscuan04.pages.dev/",
            "https://coloksgp19.com/",
            "https://yakuza66-gaming.pages.dev/"
        ];

        var automationInterval;
        var inputField = document.getElementById("remote-url-input");
        var iframe = document.getElementById("ad-frame");
        var urlText = document.getElementById("url-text");

        // Fungsi untuk mengambil URL acak dari daftarSitus
        function acakUrl() {
            var urlTerpilih = daftarSitus[Math.floor(Math.random() * daftarSitus.length)];
            inputField.value = urlTerpilih;
            iframe.src = urlTerpilih;
            urlText.innerText = urlTerpilih;
        }

        // Jalankan rotasi pertama kali saat halaman dibuka
        window.onload = function() {
            acakUrl();
        };

        function saveAndRefresh() {
            var customUrl = inputField.value;
            if (customUrl) {
                iframe.src = customUrl;
                urlText.innerText = customUrl;
            }
        }

        function startAutomation() {
            var timerValue = parseInt(document.getElementById("auto-timer").value);
            clearInterval(automationInterval);
            
            // Setiap interval waktu habis, sistem akan mengacak URL lagi
            automationInterval = setInterval(function() {
                acakUrl();
            }, timerValue);
            
            alert("Otomatisasi dijalankan!");
        }

        function stopAutomation() {
            clearInterval(automationInterval);
            alert("Otomatisasi dihentikan.");
        }
    </script>
</body>
</html>
