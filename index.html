<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotasi Web Otomatis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: white; padding: 15px; text-align: center; }
    
    .header { margin-bottom: 15px; }
    .status { font-size: 14px; color: #00ffcc; margin-top: 5px; }
    .timer { font-size: 12px; color: #aaa; margin-top: 3px; }

    /* Bingkai tempat situs web tampil */
    iframe {
      width: 100%;
      height: 75vh;
      border: 2px solid #333;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2 id="title">Memuat Web...</h2>
    <div class="status" id="statusText">Situs 1 dari 6</div>
    <div class="timer" id="timerText">Berganti dalam: 60 detik</div>
  </div>

  <!-- Layar yang menampilkan situs web -->
  <iframe id="webFrame" src=""></iframe>

  <script>
    // 1. Daftar URL situs yang ingin diputar (Silakan ubah/tambah URL di sini)
    const daftarUrl = [
      "https://keytoto.com/",
      "https://superpetir19.com/",
      "https://lucu123landasan.co/",
      "https://evoscuan04.pages.dev/",
      "https://coloksgp19.com/",
      "https://yakuza66-gaming.pages.dev/"
    ];

    let indeksSekarang = 0;
    let sisaWaktu = 60; // Waktu dalam detik (60 detik = 1 menit)

    const frame = document.getElementById("webFrame");
    const title = document.getElementById("title");
    const statusText = document.getElementById("statusText");
    const timerText = document.getElementById("timerText");

    // Fungsi untuk mengganti situs web
    function gantiWeb() {
      const urlTujuan = daftarUrl[indeksSekarang];
      frame.src = urlTujuan;
      
      title.innerText = "Situs: " + urlTujuan.replace("https://", "");
      statusText.innerText = `Menampilkan situs ${indeksSekarang + 1} dari ${daftarUrl.length}`;
      
      // Lanjut ke indeks berikutnya (jika sudah di akhir, kembali ke 0)
      indeksSekarang = (indeksSekarang + 1) % daftarUrl.length;
      sisaWaktu = 60; // Reset hitungan mundur
    }

    // Fungsi hitung mundur detik
    setInterval(() => {
      sisaWaktu--;
      timerText.innerText = `Berganti dalam: ${sisaWaktu} detik`;

      if (sisaWaktu <= 0) {
        gantiWeb();
      }
    }, 1000);

    // Jalankan web pertama kali saat halaman dibuka
    gantiWeb();
  </script>

</body>
</html>
