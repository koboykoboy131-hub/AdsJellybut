<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdsJellybut Rotator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: white; text-align: center; padding: 10px; }
    
    .header { padding: 10px 0; background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; }
    .title { font-size: 16px; font-weight: bold; color: #fff; word-break: break-all; }
    .status { font-size: 13px; color: #00ffcc; margin-top: 4px; }
    .timer { font-size: 12px; color: #ffcc00; margin-top: 2px; font-weight: bold; }

    /* Ukuran menyesuaikan layar HP */
    iframe {
      width: 100%;
      height: 80vh;
      border: 2px solid #333;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title" id="titleText">Memuat Web...</div>
    <div class="status" id="statusText">Situs 1 dari 5</div>
    <div class="timer" id="timerText">Berganti dalam: 60 detik</div>
  </div>

  <!-- Layar penampil web -->
  <iframe id="webFrame" src=""></iframe>

  <script>
    // Daftar URL publik yang bisa dibuka dalam iframe
    const daftarUrl = [
      "https://keytoto.com/",
      "https://superpetir19.com/",
      "https://lucu123landasan.co/",
      "https://evoscuan04.pages.dev/",
      "https://coloksgp19.com/",
      "https://yakuza66-gaming.pages.dev/"
    ];

    let indeksSekarang = 0;
    let sisaWaktu = 60; // Hitungan mundur per situs (60 detik)

    const frame = document.getElementById("webFrame");
    const titleText = document.getElementById("titleText");
    const statusText = document.getElementById("statusText");
    const timerText = document.getElementById("timerText");

    function gantiWeb() {
      const urlTujuan = daftarUrl[indeksSekarang];
      frame.src = urlTujuan;
      
      titleText.innerText = "Situs: " + urlTujuan;
      statusText.innerText = `Menampilkan situs ${indeksSekarang + 1} dari ${daftarUrl.length}`;
      
      indeksSekarang = (indeksSekarang + 1) % daftarUrl.length;
      sisaWaktu = 60; 
    }

    // Timer hitung mundur 1 detik
    setInterval(() => {
      sisaWaktu--;
      timerText.innerText = `Berganti dalam: ${sisaWaktu} detik`;

      if (sisaWaktu <= 0) {
        gantiWeb();
      }
    }, 1000);

    // Jalankan pertama kali
    gantiWeb();
  </script>

</body>
</html>
