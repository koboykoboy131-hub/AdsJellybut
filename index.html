<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Pop-up Iklan Rotasi 1 Menit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f4f4f9;
            text-align: center;
        }

        /* Background Gelap Overlay */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Kotak Pop-up */
        .popup-box {
            background-color: #ffffff;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Frame URL Web */
        .popup-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol Close (X) */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            z-index: 1001;
            background: #fff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            text-align: center;
            line-height: 32px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .close-btn:hover {
            color: #ff0000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>Selamat Datang di Website Saya</h1>
    <p>Tunggu sekitar 2 detik, pop-up iklan acak akan otomatis muncul.</p>

    <!-- Overlay & Pop-up Iklan -->
    <div id="popup-overlay" class="popup-overlay">
        <div class="popup-box">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <iframe id="popup-frame" src="" class="popup-iframe" title="Iklan Web"></iframe>
        </div>
    </div>

    <script>
        const urlList = [
            "https://keytoto.com/",
            "https://superpetir19.com/",
            "https://lucu123landasan.co/",
            "https://evoscuan04.pages.dev/",
            "https://coloksgp19.com/",
            "https://yakuza66-gaming.pages.dev/",
            "https://pusat.coloksgp-bet.cloud/",
            "https://official.pantaslucu123.com/",
            "https://dana.tokoipad.click/",
            "https://pastigampangmenang.pages.dev/",
            "https://mobile.keytoto-indonesia-my.id/",
            "https://permainan.iosbetcastle.art/",
            "https://katak22.net/",
            "https://sanca999.ink/",
            "https://situs.omacuan-resmigacorabiss.com/",
            "https://gate.api66-core.host/",
            "https://eksklusif.wrapfactorykc.online/",
            "https://tuanpetir.com/",
            "https://ms.akses-samurai69.com/",
            "https://galakkale.wopslot-zeus.forum/",
            "https://omacuan.com/",
            "https://urbangreen.store/",
            "https://indo88win.org/"
        ];

        // Fungsi memilih URL acak baru
        function changeRandomUrl() {
            const randomIndex = Math.floor(Math.random() * urlList.length);
            const selectedUrl = urlList[randomIndex];
            document.getElementById('popup-frame').src = selectedUrl;
        }

        function showPopup() {
            // Pilih URL acak pertama
            changeRandomUrl();
            document.getElementById('popup-overlay').style.display = 'flex';

            // Set interval untuk mengacak & mengganti URL setiap 1 menit (60.000 ms)
            setInterval(changeRandomUrl, 60000);
        }

        // Tutup pop-up (hanya menyembunyikan tampilan, interval 1 menit tetap berjalan)
        function closePopup() {
            document.getElementById('popup-overlay').style.display = 'none';
        }

        window.onload = function() {
            setTimeout(showPopup, 2000);
        };

        window.onclick = function(event) {
            const overlay = document.getElementById('popup-overlay');
            if (event.target === overlay) {
                closePopup();
            }
        };
    </script>
</body>
</html>
