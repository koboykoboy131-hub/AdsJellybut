<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Catatan Saya</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; padding: 20px; }
    .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
    button { background: #007bff; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    ul { list-style: none; }
    li { background: #f9f9f9; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
    .delete-btn { background: #dc3545; padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Daftar Catatan</h2>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Tulis catatan baru...">
      <button onclick="addTask()">Tambah</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    const input = document.getElementById('taskInput');
    const list = document.getElementById('taskList');

    function loadTasks() {
      const tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        list.innerHTML += `
          <li>
            <span>${task}</span>
            <button class="delete-btn" onclick="deleteTask(${index})">Hapus</button>
          </li>
        `;
      });
    }

    function addTask() {
      const text = input.value.trim();
      if (!text) return alert('Catatan tidak boleh kosong!');
      const tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
      tasks.push(text);
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      input.value = '';
      loadTasks();
    }

    function deleteTask(index) {
      const tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
      tasks.splice(index, 1);
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
      loadTasks();
    }

    loadTasks();
  </script>

</body>
</html>
