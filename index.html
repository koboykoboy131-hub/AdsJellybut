<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JellybutAdsControler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; padding: 15px; }
    
    .sub-header { font-size: 11px; color: #58a6ff; letter-spacing: 1px; font-weight: bold; margin-bottom: 2px; }
    h1 { font-size: 24px; color: #ffffff; font-weight: bold; margin-bottom: 2px; }
    .status-root { font-size: 10px; color: #8b949e; letter-spacing: 0.5px; margin-bottom: 15px; }

    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .card-title { font-size: 11px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    input[type="text"], select {
      width: 100%; padding: 12px; background-color: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; color: #e6edf3; font-size: 13px; margin-bottom: 10px; outline: none;
    }

    .btn {
      display: block; width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase;
    }
    .btn-blue { background-color: #1f6feb; color: #ffffff; }
    .btn-blue:active { background-color: #1158c7; }
    .btn-clear { background: none; border: none; color: #ff7b72; font-size: 10px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn-start { background-color: #1f6feb; color: #ffffff; flex: 1; }
    .btn-stop { background-color: #21262d; color: #8b949e; border: 1px solid #30363d; flex: 1; cursor: not-allowed; }

    .url-display { font-size: 11px; color: #e6edf3; word-break: break-all; margin-bottom: 5px; }
    .webview-status { font-size: 12px; color: #58a6ff; margin-bottom: 10px; }

    /* Iframe disesuaikan agar tampilan web/iklan maksimal */
    iframe { width: 100%; height: 400px; border: 1px solid #1f6feb; border-radius: 8px; background-color: #ffffff; }

    /* Style Log Container */
    .log-box {
      max-height: 150px; overflow-y: auto; background-color: #0d1117;
      border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 11px;
    }
    .log-item { margin-bottom: 6px; border-bottom: 1px solid #21262d; padding-bottom: 4px; word-break: break-all; }
    .log-time { color: #8b949e; margin-right: 6px; }
    .log-url { color: #7ee787; }

    /* Modal Pemblokiran Root */
    .root-warning {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0d1117; color: #ff7b72; padding: 30px 20px; text-align: center;
      z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
    }
    .root-warning h2 { font-size: 20px; margin-bottom: 10px; }
    .root-warning p { font-size: 14px; color: #8b949e; }
  </style>
</head>
<body>

  <!-- Tampilan Peringatan Jika HP Root -->
  <div id="root-screen" class="root-warning">
    <h2>Akses Ditolak</h2>
    <p>Aplikasi ini tidak mendukung perangkat yang di-root (Root/Magisk Detected).</p>
  </div>

  <!-- Tampilan Utama Dashboard -->
  <div id="app-screen">
    <div class="sub-header">CONTROL WEB JELLYBUT</div>
    <h1>JellybutAdsControler</h1>
    <div class="status-root" id="root-status">NON-ROOT DEVICE • SYSTEM SECURE</div>

    <div class="card">
      <div class="card-title">Remote URL Source</div>
      <input type="text" id="remote-url" value="https://koboykoboy131-hub.github.io/AdsJellybut/">
      <button class="btn btn-blue" onclick="saveAndRefresh()">Save & Refresh</button>
    </div>

    <div class="card">
      <div class="card-title">Automation</div>
      <!-- Pilihan timer diperbarui ke durasi yang lebih stabil untuk pemuatan iklan -->
      <select id="auto-timer">
        <option value="30">30 Detik (Rekomendasi Iklan)</option>
        <option value="60">1 Menit</option>
        <option value="300">5 Menit</option>
        <option value="600">10 Menit</option>
      </select>
      <div class="btn-group">
        <button id="btn-start" class="btn btn-start" onclick="startAutomation()">Start</button>
        <button id="btn-stop" class="btn btn-stop" onclick="stopAutomation()">Stop</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Webview</div>
      <div class="url-display" id="current-url">https://pusat.coloksgp-bet.cloud/</div>
      <div class="webview-status" id="wv-status">WebView Berjalan</div>
      
      <!-- Pembatasan sandbox dan no-referrer dihapus agar skrip iklan aktif normal -->
      <iframe 
        id="ad-frame"
        src="" 
        allow="autoplay; encrypted-media; fullscreen"
        loading="eager">
      </iframe>
    </div>

    <!-- Panel Log Riwayat -->
    <div class="card">
      <div class="card-title">
        <span>Activity Log</span>
        <button class="btn-clear" onclick="clearLogs()">Clear Log</button>
      </div>
      <div class="log-box" id="log-container"></div>
    </div>
  </div>

  <script>
    // 1. Deteksi Root sederhana via JavaScript/UserAgent
    function checkRoot() {
      var isRooted = false;
      if (window.Android && window.Android.isRooted && window.Android.isRooted()) {
        isRooted = true;
      }
      
      if (isRooted) {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('root-screen').style.display = 'flex';
      }
    }
    checkRoot();

    // 2. Daftar URL Iframe & Pengalihan
    var safeLandingPages = [
      "https://keytoto.com/",
      "https://superpetir19.com/",
      "https://lucu123landasan.co/",
      "https://evoscuan04.pages.dev/",
      "https://coloksgp19.com/",
      "https://yakuza66-gaming.pages.dev/",
      "https://pusat.coloksgp-bet.cloud/",
      "https://official.pantaslucu123.com/",
      "https://dana.tokoipad.click/",
      "https://pastigampangmenang.pages.dev/",
      "https://mobile.keytoto-indonesia-my.id/",
      "https://permainan.iosbetcastle.art/",
      "https://katak22.net/",
      "https://sanca999.ink/",
      "https://situs.omacuan-resmigacorabiss.com/",
      "https://gate.api66-core.host/",
      "https://eksklusif.wrapfactorykc.online/",
      "https://tuanpetir.com/",
      "https://ms.akses-samurai69.com/",
      "https://galakkale.wopslot-zeus.forum/",
      "https://omacuan.com/",
      "https://urbangreen.store/",
      "https://indo88win.org/"
    ];

    var timerId = null;

    function addLog(url) {
      var logContainer = document.getElementById('log-container');
      var now = new Date();
      var timeString = now.toTimeString().split(' ')[0];
      
      var logEntry = document.createElement('div');
      logEntry.className = 'log-item';
      logEntry.innerHTML = '<span class="log-time">[' + timeString + ']</span><span class="log-url">' + url + '</span>';
      
      logContainer.insertBefore(logEntry, logContainer.firstChild);
    }

    function clearLogs() {
      document.getElementById('log-container').innerHTML = '';
    }

    function loadRandomUrl() {
      var randomIndex = Math.floor(Math.random() * safeLandingPages.length);
      var selectedUrl = safeLandingPages[randomIndex].trim();
      
      document.getElementById('ad-frame').src = selectedUrl;
      document.getElementById('current-url').innerText = selectedUrl;
      
      addLog(selectedUrl);
    }

    function startAutomation() {
      loadRandomUrl();
      var seconds = parseInt(document.getElementById('auto-timer').value);
      
      if (timerId) clearInterval(timerId);
      
      timerId = setInterval(function() {
        loadRandomUrl();
      }, seconds * 1000);

      document.getElementById('wv-status').innerText = "WebView Berjalan (Otomatis)";
      document.getElementById('btn-start').style.opacity = "0.5";
      document.getElementById('btn-stop').style.cursor = "pointer";
      document.getElementById('btn-stop').style.backgroundColor = "#da3633";
      document.getElementById('btn-stop').style.color = "#ffffff";
    }

    function stopAutomation() {
      if (timerId) clearInterval(timerId);
      document.getElementById('wv-status').innerText = "WebView dihentikan (STOP)";
      document.getElementById('btn-start').style.opacity = "1";
      document.getElementById('btn-stop').style.cursor = "not-allowed";
      document.getElementById('btn-stop').style.backgroundColor = "#21262d";
      document.getElementById('btn-stop').style.color = "#8b949e";
    }

    function saveAndRefresh() {
      loadRandomUrl();
    }

    // Jalankan pertama kali
    loadRandomUrl();
  </script>

</body>
</html>
