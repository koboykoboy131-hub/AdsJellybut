<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jellybut Controler + Ads Integration</title>

    <!-- ============================================================ -->
    <!-- [SLOT 1] SCRIPT IKLAN HEADER / DIRECT LINK dari AD NETWORK   -->
    <!-- Tempel kode iklan dari penyedia iklan kamu di bawah ini      -->
    <!-- Contoh: <script src="https://alwingulla.com/script.js"></script> -->
    <!-- ============================================================ -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .card-label { font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 12px; }
        
        /* Area khusus penampung iklan banner */
        .ad-container {
            width: 100%;
            min-height: 50px;
            background-color: #05070d;
            border: 1px dashed #374151;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            overflow: hidden;
            text-align: center;
        }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; background-color: #16a34a; color: white; }
        .webview-box { width: 100%; height: 350px; background-color: #000; border-radius: 8px; border: 1px solid #1f2937; }
        .webview-box iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- [SLOT 2] IKLAN BANNER ATAS (Contoh Ukuran 320x50 atau 300x250) -->
    <!-- ============================================================ -->
    <div class="ad-container" id="ad-slot-top">
        <!-- PASTE KODE BANNER IKLAN KAMU DI SINI -->
        <span style="font-size: 11px; color: #6b7280;">[ Slot Iklan Banner Atas ]</span>
    </div>

    <!-- Header & Kontrol -->
    <div class="card">
        <div class="card-label">GOOGLE APPS SCRIPT BACKEND</div>
        <button class="btn" onclick="triggerGAS()">TRIGGER URLFETCHAPP (GAS)</button>
    </div>

    <!-- ============================================================ -->
    <!-- [SLOT 3] IKLAN BANNER TENGAH                                  -->
    <!-- ============================================================ -->
    <div class="ad-container" id="ad-slot-middle">
        <!-- PASTE KODE BANNER IKLAN KEDUA DI SINI -->
        <span style="font-size: 11px; color: #6b7280;">[ Slot Iklan Banner Tengah ]</span>
    </div>

    <!-- WebView Display -->
    <div class="card">
        <div class="card-label">WEBVIEW DISPLAY</div>
        <div class="webview-box">
            <iframe id="ad-frame" src="https://keytoto.com/"></iframe>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxpgunv7ZkN4uky2NCDrqsLMHNGu1BC_4x9uTgy6IXoelKHgqWmgl-9T2ET0jUQAZ4M/exec";
        const currentActiveUrl = "https://keytoto.com/";

        function triggerGAS() {
            const img = new Image();
            img.src = `${GAS_WEB_APP_URL}?url=${encodeURIComponent(currentActiveUrl)}&t=${new Date().getTime()}`;
        }
    </script>
</body>
</html>
