<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JellybutAdsControler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: #070c14; 
      color: #e0f2fe; 
      padding: 15px; 
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.15), transparent 70%),
        linear-gradient(to bottom, #070c14, #04070d);
      min-height: 100vh;
    }
    
    .sub-header { font-size: 10px; color: #38bdf8; letter-spacing: 1.5px; font-weight: bold; margin-bottom: 2px; text-shadow: 0 0 5px rgba(56, 189, 248, 0.5); }
    h1 { font-size: 22px; color: #ffffff; font-weight: 800; margin-bottom: 2px; letter-spacing: 0.5px; }
    .status-root { font-size: 9px; color: #94a3b8; letter-spacing: 0.8px; margin-bottom: 15px; font-weight: 600; }

    .card { 
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.4)); 
      border: 1px solid rgba(56, 189, 248, 0.25); 
      border-radius: 12px; 
      padding: 14px; 
      margin-bottom: 12px; 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(56, 189, 248, 0.05);
      backdrop-filter: blur(8px);
    }
    .card-title { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px; }

    input[type="text"], select {
      width: 100%; 
      padding: 10px 12px; 
      background-color: rgba(7, 12, 20, 0.9); 
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px; 
      color: #38bdf8; 
      font-size: 12px; 
      margin-bottom: 10px; 
      outline: none;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
    }

    input[type="text"]:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4), inset 0 0 8px rgba(0, 0, 0, 0.8);
    }

    .btn {
      display: block; 
      width: 100%; 
      padding: 10px; 
      border: none; 
      border-radius: 8px;
      font-weight: 800; 
      font-size: 13px; 
      cursor: pointer; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    
    .btn-blue { 
      background: linear-gradient(180deg, #0284c7, #0369a1); 
      color: #ffffff; 
      border: 1px solid #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .btn-blue:active { transform: scale(0.98); opacity: 0.9; }
    
    .btn-group { display: flex; gap: 10px; }
    
    .btn-start { 
      background: linear-gradient(180deg, #22c55e, #15803d); 
      color: #ffffff; 
      border: 1px solid #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.4);
      flex: 1; 
    }
    .btn-start:active { transform: scale(0.98); }

    .btn-stop { 
      background: linear-gradient(180deg, #1e293b, #0f172a); 
      color: #64748b; 
      border: 1px solid #334155; 
      flex: 1; 
      cursor: not-allowed; 
    }

    .url-display { font-size: 11px; color: #38bdf8; word-break: break-all; margin-bottom: 4px; }
    .webview-status { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }

    .iframe-wrapper {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    iframe { width: 100%; height: 320px; border: none; background-color: #ffffff; display: block; }

    /* Modal Pemblokiran Root */
    .root-warning {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #070c14; color: #ef4444; padding: 30px 20px; text-align: center;
      z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
    }
    .root-warning h2 { font-size: 20px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
    .root-warning p { font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Screen jika terdeteksi Root -->
  <div id="root-screen" class="root-warning">
    <h2>AKSES DITOLAK</h2>
    <p>Aplikasi tidak mendukung perangkat yang di-root (Root/Magisk Detected).</p>
  </div>

  <!-- Screen Utama Dashboard -->
  <div id="app-screen">
    <div class="sub-header">CONTROL WEB JELLYBUT</div>
    <h1>JellybutAdsControler</h1>
    <div class="status-root" id="root-status">NON-ROOT DEVICE • SYSTEM SECURE</div>

    <div class="card">
      <div class="card-title">REMOTE URL SOURCE (ROTASI OTOMATIS)</div>
      <input type="text" id="remote-url" value="https://superpetir19.com/">
      <button class="btn btn-blue" onclick="saveAndRefresh()">SAVE & REFRESH</button>
    </div>

    <div class="card">
      <div class="card-title">AUTOMATION</div>
      <select id="auto-timer">
        <option value="5">5 Detik (auto pilih)</option>
        <option value="300">5 menit (auto pilih)</option>
        <option value="600">10 menit (auto pilih)</option>
      </select>
      <div class="btn-group">
        <button id="btn-start" class="btn btn-start" onclick="startAutomation()">START</button>
        <button id="btn-stop" class="btn btn-stop" onclick="stopAutomation()">STOP</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">WEBVIEW</div>
      <div class="url-display" id="current-url">https://superpetir19.com/</div>
      <div class="webview-status" id="wv-status">WebView Berjalan</div>
      
      <div class="iframe-wrapper">
        <iframe 
          id="ad-frame"
          src="" 
          sandbox="allow-scripts allow-same-origin"
          referrerpolicy="no-referrer"
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>

  <script>
    function checkRoot() {
      var isRooted = false;
      if (window.Android && window.Android.isRooted && window.Android.isRooted()) {
        isRooted = true;
      }
      if (isRooted) {
        document.getElementById('app-screen').style.display = 'none';
        document.getElementById('root-screen').style.display = 'flex';
      }
    }
    checkRoot();

    var safeLandingPages = [
      "https://keytoto.com/",
      "https://superpetir19.com/",
      "https://lucu123landasan.co/",
      "https://evoscuan04.pages.dev/",
      "https://coloksgp19.com/",
      "https://yakuza66-gaming.pages.dev/"
    ];

    var timerId = null;

    function loadRandomUrl() {
      var randomIndex = Math.floor(Math.random() * safeLandingPages.length);
      var selectedUrl = safeLandingPages[randomIndex].trim();
      
      document.getElementById('ad-frame').src = selectedUrl;
      document.getElementById('current-url').innerText = selectedUrl;
    }

    function startAutomation() {
      loadRandomUrl();
      var seconds = parseInt(document.getElementById('auto-timer').value);
      
      if (timerId) clearInterval(timerId);
      
      timerId = setInterval(function() {
        loadRandomUrl();
      }, seconds * 1000);

      document.getElementById('wv-status').innerText = "WebView Berjalan (Otomatis)";
      document.getElementById('btn-start').style.opacity = "0.7";
      
      var btnStop = document.getElementById('btn-stop');
      btnStop.style.cursor = "pointer";
      btnStop.style.background = "linear-gradient(180deg, #ef4444, #b91c1c)";
      btnStop.style.color = "#ffffff";
      btnStop.style.border = "1px solid #f87171";
      btnStop.style.boxShadow = "0 0 12px rgba(239, 68, 68, 0.4)";
    }

    function stopAutomation() {
      if (timerId) clearInterval(timerId);
      document.getElementById('wv-status').innerText = "WebView dihentikan (STOP)";
      document.getElementById('btn-start').style.opacity = "1";
      
      var btnStop = document.getElementById('btn-stop');
      btnStop.style.cursor = "not-allowed";
      btnStop.style.background = "linear-gradient(180deg, #1e293b, #0f172a)";
      btnStop.style.color = "#64748b";
      btnStop.style.border = "1px solid #334155";
      btnStop.style.boxShadow = "none";
    }

    function saveAndRefresh() {
      var manualUrl = document.getElementById('remote-url').value;
      if (manualUrl) {
        document.getElementById('ad-frame').src = manualUrl;
        document.getElementById('current-url').innerText = manualUrl;
      } else {
        loadRandomUrl();
      }
    }

    loadRandomUrl();
  </script>

</body>
</html>
