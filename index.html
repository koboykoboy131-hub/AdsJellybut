<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Web GitHub Pages</title>
    
    <style>
        #ad-container {
            display: none; /* Tersembunyi sampai diverifikasi oleh Apps Script */
            margin: 20px 0;
            padding: 10px;
            text-align: center;
        }
        .btn-target {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Selamat Datang di Web Saya</h1>
    <p>Akses situs utama kami melalui tombol di bawah ini:</p>

    <!-- Tombol dengan Alamat URL Target -->
    <a id="target-link" href="https://mobile.keytoto-indonesia-my.id/" class="btn-target" target="_blank">
        Buka Mobile Keytoto Indonesia
    </a>

    <!-- Wadah Iklan Dinamis -->
    <div id="ad-container"></div>

    <script>
        // Ganti dengan URL Web App Google Apps Script milikmu
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxEhEO46cP0zflehPaM1Nhb_GLBCiWJ4DAGIautD9blC2irOnB6k-QInqrii3Scjp6wMw/exec";

        async function muatKontrolIklan() {
            try {
                // Fetch data dari Google Apps Script
                const response = await fetch(GAS_URL);
                const config = await response.json();

                // Update URL tombol jika ada update dari server GAS
                if (config.target_url) {
                    document.getElementById("target-link").href = config.target_url;
                }

                // Cek status tayangan iklan (ON/OFF)
                if (config.ads_enabled) {
                    tampilkanIklan(config.ad_client_id, config.ad_slot_id);
                } else {
                    console.log("Iklan dimatikan dari kontrol jarak jauh.");
                }
            } catch (error) {
                console.error("Gagal mengambil konfigurasi:", error);
            }
        }

        function tampilkanIklan(clientId, slotId) {
            const container = document.getElementById("ad-container");

            // 1. Muat Script Google AdSense secara dinamis
            const adScript = document.createElement("script");
            adScript.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${clientId}`;
            adScript.async = true;
            adScript.crossOrigin = "anonymous";
            document.head.appendChild(adScript);

            // 2. Buat Elemen Unit Iklan
            const ins = document.createElement("ins");
            ins.className = "adsbygoogle";
            ins.style.display = "block";
            ins.setAttribute("data-ad-client", clientId);
            ins.setAttribute("data-ad-slot", slotId);
            ins.setAttribute("data-ad-format", "auto");
            ins.setAttribute("data-full-width-responsive", "true");

            container.appendChild(ins);
            container.style.display = "block";

            // 3. Jalankan iklan
            (adsbygoogle = window.adsbygoogle || []).push({});
        }

        // Jalankan saat halaman dimuat
        window.addEventListener("DOMContentLoaded", muatKontrolIklan);
    </script>
</body>
</html>
